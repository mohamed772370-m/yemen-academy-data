name: Publish synced site parts
on:
  push:
    branches: [main]
    paths: [site-upload.part03]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Combine, decode, unpack, and publish
        run: |
          set -euo pipefail
          cat site-upload.part00 site-upload.part01 site-upload.part02 site-upload.part03 | base64 -d > site-upload.zip
          rm -rf /tmp/site-upload
          mkdir -p /tmp/site-upload
          unzip -q site-upload.zip -d /tmp/site-upload
          cp /tmp/site-upload/index.html index.html
          mkdir -p assets/data
          cp /tmp/site-upload/assets/data/site-data.json assets/data/site-data.json
          rm -f site-upload.part00 site-upload.part01 site-upload.part02 site-upload.part03 site-upload.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish synced Yemen Academy site"
          git push
